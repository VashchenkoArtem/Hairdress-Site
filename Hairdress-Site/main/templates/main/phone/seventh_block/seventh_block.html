{% load static %}

<div class = "others-opinion block block-scroll">
    <div class = "hat-opinion">
        <h1 class = "hat-opinion-title">Що говорять інші</h1>
        <h2 class = "hat-opinion-description">Реальні історії перевтілень, відгуки клієнток після підбору кольору та<br>фарбування.
Їхні враження — найкраще підтвердження якості моєї роботи.</h2>
    </div>
    <div class = "opinion-container">
        <div class = "body-opinion">
            <div class = "opinion">
                <div class = "quotes">
                    <img class = "quote" src="{% static 'main/images/quotes.svg'%}" alt="">
                </div>
                <div class = "opinion-text">
                    <input type="hidden" id = 'commentIdPhone' value="{{ first_comment.id }}">
                    <h1 class = "opinion-review" id = "opinionReviewPhone">{{ first_comment.comment_text }}</h1>
                </div>
                <div class = "quotes second-qoute">
                    <img class = "quote" src="{% static 'main/images/quotes.svg'%}" alt="">
                </div>
            </div>
            <h1 class = "opinion-name"><span id = "commentAuthorPhone">{{ first_comment.author_name }}</span>, місто <span id = "commentAuthorCityPhone">{{ first_comment.author_city }}</span></h1>
        </div>
        <div class = "result-buttons">
            <button class = 'button-circle button-left button-prev-comment' id = "buttonPrevCommentPhone">
                <img class = "button-next button-image" src="{% static 'main/images/buttons/button_circle.svg'%}" alt="">
            </button>
            <button class = 'button-circle button-right-circle button-next-comment' id = "buttonNextCommentPhone">
                <img class = "button-next button-image"  src="{% static 'main/images/buttons/button_circle.svg'%}" alt="">
            </button>
        </div>
    </div>
</div>
