{% load static %}

<div class = "result block block-scroll">
    <div class = "result-title">
        <h1 class = "result-h1">Результат, що вас здивує</h1>
        <h2 class = "result-description">Дивіться, як виглядає перевтілення за індивідуальним підбором.</h2>
    </div>
    <div class = "result-body">
        <div class = "result-photos">
            <img class = "people-example-result first-photo-result first-people-example" src="{% static 'main/images/people_example/people_example3.png'%}" alt="">
            <img class = "people-example-result second-photo-result second-people-example" src="{% static 'main/images/people_example/people_example4.png'%}" alt="">
        </div>
        <div class = "result-buttons">
            <button class = 'button-circle button-left'>
                <img class = "button-next button-image" src="{% static 'main/images/buttons/button_circle.svg'%}" alt="">
            </button>
            <button class = 'button-circle button-right-circle button-right'>
                <img class = "button-next button-image" src="{% static 'main/images/buttons/button_circle.svg'%}" alt="">
            </button>
        </div>
    </div>
</div>
