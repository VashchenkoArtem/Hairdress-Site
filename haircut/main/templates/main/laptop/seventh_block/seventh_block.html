{% load static %}

<section class = "others-opinion block scroll">
    <div class = "hat-opinion">
        <h1 class = "hat-opinion-title">Що говорять інші</h1>
        <h2 class = "hat-opinion-description">Реальні історії перевтілень, відгуки клієнток після підбору кольору та фарбування.<br>
Їхні враження — найкраще підтвердження якості моєї роботи</h2>
    </div>
    <div class = "opinion-container">
        <div class = "body-opinion">
            <div class = "opinion">
                <div class = "quotes">
                    <img class = "quote" src="{% static 'main/images/quotes.svg'%}" alt="">
                </div>
                <div class = "opinion-text">
                    <input type="hidden" id = 'commentId' value="{{ first_comment.id }}">
                    <h1 class = "opinion-review" id = "opinionReview">{{ first_comment.comment_text }}</h1>
                </div>
                <div class = "quotes second-qoute">
                    <img class = "quote" src="{% static 'main/images/quotes.svg'%}" alt="">
                </div>
            </div>
            <h1 class = "opinion-name"><span id = "commentAuthor">{{ first_comment.author_name }}</span>, місто <span id = "commentAuthorCity">{{ first_comment.author_city }}</span></h1>
        </div>
        <div class = "result-buttons">
            <button class = 'button-circle button-left' id = "buttonPrevComment">
                <img class = "button-next button-image" src="{% static 'main/images/buttons/button_left.svg'%}" alt="">
            </button>
            <button class = 'button-circle button-right' id = "buttonNextComment">
                <img class = "button-next button-image" src="{% static 'main/images/buttons/button_right.svg'%}" alt="">
            </button>
        </div>
    </div>
</section>
