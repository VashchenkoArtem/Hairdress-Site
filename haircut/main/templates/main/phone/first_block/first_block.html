{% load static %}

<div class = "block block-hat">
    <div class = "frame-hat">
        <div class = "hat">
            <h1 class = "title-hat title-hat-phone">Hair <span class = "green-title-hat">Nool</span></h1>
            <button class = "button-menu-phone button-open-close">MENU</button>

    <div class = "about-me-start">

                        <button class = "button button-green button-next-phone"> <img class = "image-next" src="{% static 'main/images/buttons/arrow.svg'%}" alt=""></button>
