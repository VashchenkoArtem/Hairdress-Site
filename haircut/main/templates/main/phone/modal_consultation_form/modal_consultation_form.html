{% load static %}

<div class = "consultation-form-phone hidden">
    <div class = "modal-consultation-hat">
        <div class = "modal-consultation-hat-container">
            <h1 class = "modal-consultation-hat-title">Консультація</h1>
            <img class = "modal-consultation-hat-button" src="{% static 'main/images/buttons/cross.svg'%}" alt="">
        </div>
        <h2 class = "modal-consultation-warning">Ця послуга є платною</h2>
    </div>
    <div class = "modal-content">
        <div class = "modal-inputs-container">
            <div class = "modal-inputs">
                <h1 class = "modal-inputs-title">1. Заповнення форми</h1>
                <form class = "modal-inputs-container"enctype="multipart/form-data">
                    <input id="inputNameModal" type="text" class = "modal-input-phone modal-phone-name" placeholder="Ім'я та прізвище">
                    <input id="inputPhoneModal" type="text" class = "modal-input-phone modal-phone-number" placeholder="Номер телефону">
                    <input id="inputEmailModal" type="text" class = "modal-input-phone modal-phone-email" placeholder="Пошта">
                    <input type="file" id="idPhotoPhone" class="modal-phone-photos input-form modal-photos input-modal-form modal-input-phone hidden" name="photos" accept="image/*" multiple required>
                    <label class = "input-form input-image" for = "idPhotoPhone">
                        <img class = "apply-photo-image" src="{% static 'main/images/icons/field.svg'%}" alt="">
                        <span class = "apply-photo">Прикріпити фото</span>
                    </label>
                    <input type="text" class = "modal-input-phone modal-phone-wish" placeholder="Побажання">
                </form>
            </div>
        </div>
        <div class = "photos-container-phone">
        </div>
        <div class = "modal-payment-methods hidden">
            <h1 class="modal-inputs-title">2. Оплата послуги</h1>
            <div class = "payment-buttons-phone">
                <div class = "button-of-pay mono-button">
                    <img class = "payment-image-phone" src="{% static 'main/images/buttons/mono.svg' %}" alt="">
                </div>                                    
                <form method="POST" accept-charset="utf-8" target="_blank" action="https://www.liqpay.ua/api/3/checkout">
                    <input type="hidden" id="liqpayDataPhone" name="data" value="" />
                    <input type="hidden" id="liqpaySignaturePhone" name="signature" value=""/>         
                    <button class = "button-of-pay-phone liqpay-button">
                        <img class = "payment-image-phone"src="{% static 'main/images/buttons/privat.svg'%}" alt="">
                    </button>
                </form>
            </div>
        </div>
        <div>
    </div>
</div>
